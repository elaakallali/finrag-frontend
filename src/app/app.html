<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">FR</span>
      <div>
        <strong>{{ title }}</strong>
        <p>Financial RAG Console</p>
      </div>
    </div>

    <nav class="nav-links">
      <p-button
        label="Overview"
        styleClass="nav-button"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      />

      <div class="nav-group">
        <p class="nav-label">User workspace</p>
        <p-button
          label="Report ingestion"
          styleClass="nav-button"
          routerLink="/user/report-ingestion"
          routerLinkActive="active"
        />
        <p-button
          label="Ask questions"
          styleClass="nav-button"
          routerLink="/user/report-search"
          routerLinkActive="active"
        />
        <p-button
          label="Prompt builder"
          styleClass="nav-button"
          routerLink="/user/prompt-builder"
          routerLinkActive="active"
        />
      </div>

      <div class="nav-group">
        <p class="nav-label">Admin workspace</p>
        <p-button
          label="Regulation ingestion"
          styleClass="nav-button"
          routerLink="/admin/regulation-ingestion"
          routerLinkActive="active"
        />
        <p-button
          label="Regulation history"
          styleClass="nav-button"
          routerLink="/admin/regulation-history"
          routerLinkActive="active"
        />
      </div>
    </nav>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <p class="eyebrow">Workspace</p>
        <h1>{{ title }}</h1>
      </div>
    </header>

    <section class="content-panel">
      <router-outlet />
    </section>
  </main>
</div>
