<div class="documents-page">

  <p-confirmDialog />

  @if (deleteError) {
    <p class="delete-error">{{ deleteError }}</p>
  }

  <p-table
    [value]="documents"
    [loading]="isLoading"
    [lazy]="true"
    [paginator]="true"
    [rows]="pageSize"
    [totalRecords]="totalElements"
    [rowsPerPageOptions]="[pageSize]"
    (onLazyLoad)="onPageChange($event)"
    responsiveLayout="scroll"
    styleClass="p-datatable-striped">

    <!-- Header -->
    <ng-template pTemplate="caption">
      <div class="table-header">

        <h2>Documents</h2>

        <div class="table-actions">

          <span class="p-input-icon-left">
            <i class="pi pi-search"></i>
            <input
              pInputText
              type="text"
              placeholder="Rechercher par nom..."
              [(ngModel)]="searchName"
              (ngModelChange)="onSearchChange()" />
          </span>

          <p-button
            icon="pi pi-refresh"
            severity="secondary"
            [outlined]="true"
            pTooltip="Refresh"
            (onClick)="reloadDocuments()">
          </p-button>

          <p-button
            label="Upload"
            icon="pi pi-plus"
            routerLink="/admin/document-upload">
          </p-button>

        </div>

      </div>
    </ng-template>

    <!-- Table Header -->
    <ng-template pTemplate="header">
      <tr>

        <th pSortableColumn="name">
          Document Name
          <p-sortIcon field="name"></p-sortIcon>
        </th>

        <th pSortableColumn="uploadDate">
          Upload Date
          <p-sortIcon field="uploadDate"></p-sortIcon>
        </th>

        <th style="width: 180px; text-align: center;">
          Actions
        </th>

      </tr>
    </ng-template>

    <!-- Table Body -->
    <ng-template pTemplate="body" let-doc>
      <tr>

        <td>
          <div class="document-name">

            <i class="pi pi-file-pdf pdf-icon"></i>

            <button
              type="button"
              class="document-link"
              (click)="viewDocument(doc)">
              {{ doc.name }}
            </button>

          </div>
        </td>

        <td>
          {{ doc.uploadDate }}
        </td>

        <td>

          <div class="action-buttons">

            <p-button
              icon="pi pi-eye"
              [text]="true"
              [rounded]="true"
              severity="secondary"
              pTooltip="View"
              tooltipPosition="top"
              (onClick)="viewDocument(doc)">
            </p-button>

            <p-button
              icon="pi pi-download"
              [text]="true"
              [rounded]="true"
              severity="secondary"
              pTooltip="Download"
              tooltipPosition="top"
              (onClick)="downloadDocument(doc)">
            </p-button>

            <p-button
              icon="pi pi-trash"
              [text]="true"
              [rounded]="true"
              severity="danger"
              pTooltip="Delete"
              tooltipPosition="top"
              (onClick)="deleteDocument(doc)">
            </p-button>

          </div>

        </td>

      </tr>
    </ng-template>

    <!-- Empty State -->
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="text-center">
          @if (searchName) {
            Aucun document ne correspond a « {{ searchName }} ».
          } @else {
            Aucun document trouve.
          }
        </td>
      </tr>
    </ng-template>

  </p-table>

</div>
