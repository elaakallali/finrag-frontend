<div class="layout-wrapper">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-box">
        <i class="pi pi-chart-bar"></i>
      </div>
      <div class="logo-texts">
        <span class="logo-title">FinRAG</span>
        <span class="logo-subtitle">AI Document Intelligence</span>
      </div>
    </div>

    <!-- ========== SIDEBAR ADMIN ========== -->
    @if (!isUserMode) {
      <nav class="sidebar-nav">
        <a
          routerLink="/report-query"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-item"
        >
          <i class="pi pi-th-large"></i>
          <span>Dashboard</span>
        </a>

        <a routerLink="/admin/document-history" routerLinkActive="active-link" class="nav-item">
          <i class="pi pi-file"></i>
          <span>Documents</span>
          <span class="badge">1.2k</span>
        </a>

        <a routerLink="/admin/document-upload" routerLinkActive="active-link" class="nav-item">
          <i class="pi pi-upload"></i>
          <span>Upload</span>
        </a>

        <a routerLink="/admin/users" routerLinkActive="active-link" class="nav-item">
          <i class="pi pi-users"></i>
          <span>Users</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button type="button" class="nav-item logout-button">
          <i class="pi pi-sign-out"></i>
          <span>Logout</span>
        </button>

        <div class="role-switch" aria-label="Role switch">
          <a routerLink="/report-query" class="role-option" [class.active]="!isUserMode">Admin</a>
          <a routerLink="/user" class="role-option" [class.active]="isUserMode">User</a>
        </div>

        <div class="profile-card">
          <div class="avatar">DA</div>
          <div class="profile-copy">
            <span class="profile-name">Dhouha Admin</span>
            <span class="profile-email">admin&#64;finrag.ai</span>
          </div>
          <i class="pi pi-angle-right"></i>
        </div>
      </div>
    }

    <!-- ========== SIDEBAR USER ========== -->
    @if (isUserMode) {
      <nav class="sidebar-nav">
        <a routerLink="/user" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
          <i class="pi pi-comments"></i>
          <span>Chat</span>
        </a>

        <a routerLink="/user/history" routerLinkActive="active-link" class="nav-item">
          <i class="pi pi-history"></i>
          <span>History</span>
        </a>

        <a routerLink="/user/profile" routerLinkActive="active-link" class="nav-item">
          <i class="pi pi-user"></i>
          <span>Profile</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="role-switch" aria-label="Role switch">
          <a routerLink="/report-query" class="role-option" [class.active]="!isUserMode">Admin</a>
          <a routerLink="/user" class="role-option" [class.active]="isUserMode">User</a>
        </div>

        <div class="profile-card">
          <div class="avatar">DA</div>
          <div class="profile-copy">
            <span class="profile-name">Dhouha Admin</span>
            <span class="profile-email">Analyst</span>
          </div>
          <i class="pi pi-angle-right"></i>
        </div>
      </div>
    }
  </aside>

  <main class="main-content">
    <router-outlet />
  </main>
</div>
